[project]
name = "ic-schema"
version = "1.0.0"
description = "Interview Coach shared contract: events, manifest, protocol, report, bundle I/O."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3"]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.23", "mypy>=1.13", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ic_schema"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
