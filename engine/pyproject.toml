[project]
name = "ic-engine"
version = "0.1.0"
description = "Interview Coach engine: ingest, normalize, transcribe, signals, phases, metrics."
requires-python = ">=3.12"
dependencies = ["ic-schema", "pydantic>=2.9,<3"]

[project.optional-dependencies]
# Heavy (CTranslate2, PyAV, ONNX Runtime): installed only where transcription runs.
# av<19: PyAV 19 dropped av.open(metadata_errors=...), which faster-whisper 1.2.1 passes.
transcribe = ["faster-whisper>=1.1,<2", "av>=15,<19"]

[project.scripts]
interview-coach = "engine.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13", "ruff>=0.8"]

[tool.uv.sources]
ic-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.mypy]
# CLAUDE.md: strict on schema/ and engine/ai/; the rest of the engine is fully annotated but not strict.
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["whisper: needs faster-whisper and a downloaded model (run with IC_WHISPER=1)"]
